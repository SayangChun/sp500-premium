name: update-sp500-premium-data

on:
  schedule:
    # A股交易时段（北京 09:00–15:30）每 5 分钟刷新，其余时段每 15 分钟
    - cron: "*/5 1-7 * * 1-5"
    - cron: "*/15 0-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取数据并计算真实溢价率
        run: python scripts/update_data.py
      - name: 提交数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp500.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新溢价快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
